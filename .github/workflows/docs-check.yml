name: Docs Freshness Check

on:
  push:
    branches: [main]
    paths:
      - 'internal/modules/**'
      - 'tools/gendocs/**'
      - 'docs/**'
      - '.github/workflows/docs-check.yml'
  pull_request:
    paths:
      - 'internal/modules/**'
      - 'tools/gendocs/**'
      - 'docs/**'
      - '.github/workflows/docs-check.yml'

# Deny all permissions at the workflow level; each job grants only what it needs.
permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5

      - name: Setup Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: "go.mod"

      - name: Generate module documentation
        run: make gen-docs

      - name: Check for stale docs
        run: |
          git add -N docs/modules/
          if ! git diff --exit-code docs/modules/; then
            echo "::error::Module docs are out of date. Run 'make gen-docs' and commit the changes."
            exit 1
          fi

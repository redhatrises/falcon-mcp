name: Docs Freshness Check

on:
  push:
    branches: [main, go_port]
    paths:
      - 'internal/modules/**'
      - 'tools/gendocs/**'
      - 'docs/**'
      - '.github/workflows/docs-check.yml'
  pull_request:
    paths:
      - 'internal/modules/**'
      - 'tools/gendocs/**'
      - 'docs/**'
      - '.github/workflows/docs-check.yml'

# Deny all permissions at the workflow level; each job grants only what it needs.
permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "go.mod"

      - name: Generate module documentation
        run: make gen-docs

      - name: Check for stale docs
        run: |
          git add -N docs/modules/
          if ! git diff --exit-code docs/modules/; then
            echo "::error::Module docs are out of date. Run 'make gen-docs' and commit the changes."
            exit 1
          fi

name: Docker Build Test

on:
  pull_request:
    branches: [main, go_port]
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'go.mod'
      - 'go.sum'
      - 'cmd/**'
      - 'internal/**'
      - '.goreleaser.yaml'
      - '.github/workflows/docker-build-test.yml'

permissions:
  contents: read
  actions: write # GHA build cache (cache-from / cache-to type=gha)

jobs:
  docker-build-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build ${{ matrix.platform }} image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          cache-from: type=gha,scope=docker-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=docker-${{ matrix.platform }}
          tags: falcon-mcp:test-local

      - name: Smoke test image
        run: |
          echo "Testing falcon-mcp --help on ${{ matrix.platform }}..."
          docker run --rm falcon-mcp:test-local --help
          echo "Docker image smoke test passed (${{ matrix.platform }})"
